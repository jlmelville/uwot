# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled compiler drift check' ||
  format('{0}: {1}', github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor),
  github.event.inputs.name || github.event.inputs.config) }}

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: >-
          ubuntu-clang,gcc16,clang-asan,clang-ubsan,gcc-asan,valgrind,lto,rchk
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.id || github.run_id }}

jobs:

  setup:
    name: Resolve R-hub platforms
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    # Pinned to a full-length commit SHA for immutability.
    - uses: r-hub/actions/setup@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
      with:
        config: >-
          ${{ github.event_name == 'schedule' && 'ubuntu-clang,gcc16' ||
          github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    environment: rhub
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/checkout@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/platform-info@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/setup-deps@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/run-check@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    environment: rhub
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/checkout@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/setup-r@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/platform-info@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/setup-deps@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      # Pinned to a full-length commit SHA for immutability.
      - uses: r-hub/actions/run-check@4b161272a59fcd8192e5bd5e6ce183c025cb80fa
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
