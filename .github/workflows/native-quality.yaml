name: Native quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: deps::.
          dependencies: '"hard"'
      - name: Install LLVM and libc++
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-21 clang-format-21 clang-tidy-21 libc++-21-dev libc++abi-21-dev shellcheck
      - name: Check native code and worker exceptions
        env:
          CLANGXX: clang++-21
          CLANG_FORMAT: clang-format-21
          CLANG_TIDY: clang-tidy-21
        run: |
          shellcheck tools/native-quality.sh
          tools/native-quality.sh
